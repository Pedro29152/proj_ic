{% extends "base.html" %}

{% block content %}
<h1>Gravar arquivo</h1>
<form method=post enctype=multipart/form-data>
    <table style="float: left; width: 50%">
        <tr>
            <td> 
                titulo:
            </td>
            <td>
                <input type="text" name="titulo" maxlength="100" required>
            </td>
        </tr>
        <tr>
            <td>
                nome orientador:
            </td>
            <td>
                <input type="text" name="nomeOrientador" maxlength="100" required>
            </td>   
        </tr>
        <tr>
            <td>
                descricao:
            </td>
            <td>
                <textarea name="descricao" style="width: 200px; height: 200px;" required></textarea>
            </td>
        </tr>
        <tr>
            <td>
                nota:
            </td>
            <td>
                <input type="number" name="notaProj" min="0" max="10" step="0.01" value="0" required>
            </td>
        </tr>
        <tr>
            <td>
                data avalicao:
            </td>
            <td>
                <input type="date" name="dataAvaliacao" required>
            </td>
        </tr>
        <tr>
            <td>
                curso:
            </td>
            <td>
                <input list="cursos" name="curso" required>
                <datalist id="cursos">
                    {% for curso in cursos %}
                        <option value="[[ curso['descricaoCurso'] ]]">
                    {% endfor %}
                </datalist>
            </td>
        </tr>
        <tr>
            <td>
                arquivo:
            </td>
            <td>
                <input type="file" name="file" 
                onchange="document.getElementById('nome').innerHTML = this.value" id="file" required>
            </td>
        </tr>
    </table>
    <div style="float: left; width: 49%">
        <fieldset>
            <legend>
                Autor 1
            </legend>
        <label for="autor">Nome:</label>
        <input type="text" name="autor" placeholder="Digite o nome do autor"/>
        <br>
        <label for="ra">Ra:</label>
        <input type="text" name="ra_autor" placeholder="Digite o RA" maxlength="13"/>
             
        </fieldset>
        <div id="imendaHTMLautor">
    
        </div>
                
        <input type="button" id="btnAdicionaAutor" value="adicionar mais um autor" style="padding: 2px"
        onclick="adicionaAutor()">      
        <br>
        <input type=submit value=Upload>
    </div>
</form>
<p>[[ filename ]]</p>
<p id="nome"></p>

<script type="text/javascript">
var idContador = 0

function exclui(id){
	var campo = $("#"+id.id);
	campo.hide(200);
}

function adicionaAutor(){
	let tipoCampo = "autor";
	adicionaCampo(tipoCampo);
}

function adicionaCampo(tipo){
    if(idContador > 2){
        return
    }
    idContador++
    let idNome = `${tipo}_${ idContador }`
    let idRa = `ra_${tipo}_${ idContador }`
    let idDiv = `${ tipo }_div_${ idContador }`

    let tituloNome = document.createElement('label')
    tituloNome.innerHTML = `Autor extra ${ idContador }:`

    let tituloRa = document.createElement('label')
    tituloRa.innerHTML = `Ra extra ${ idContador }:`

    let div = document.createElement('div')
    div.id = idDiv
    
    let fieldset = document.createElement('fieldset')
    let legend = document.createElement('legend')
    legend.innerHTML = `Autor ${ idContador + 1 }`
    fieldset.append(legend)
    
    let inputNome = document.createElement('input')
    inputNome.type = 'text'
    inputNome.id = idNome
    inputNome.required = true
    inputNome.name = idNome

    let inputRa = document.createElement('input')
    inputRa.type = 'text'
    inputRa.id = idRa
    inputRa.required = true
    inputRa.name = idRa
    inputRa.maxLength = 13

    let btnRemove = document.createElement('input')
    btnRemove.id = 'btnRemove'
    btnRemove.type = 'button'
    btnRemove.value = 'Remover'
    btnRemove.onclick = function(){
        document.getElementById(`${ tipo }_div_${ idContador }`).remove()
        idContador--
    }

    let container = document.getElementById('imendaHTML'+ tipo)
    fieldset.append(tituloNome, inputNome)
    fieldset.innerHTML += '<br>'
    fieldset.append(tituloRa, inputRa)
    fieldset.innerHTML += '<br>'
    fieldset.append(btnRemove)
    div.append(fieldset)
    container.append(div)
}

function remove(id){
    document.getElementById(id).remove()
}
</script>
{% endblock %}
