{% extends "base.html" %}

{% block content %}
<h1>Gravar arquivo</h1>
<form method=post enctype=multipart/form-data>
    <fieldset>
        <legend>
            <h2>Campos para preenchimento </h2>
        </legend>
        <table style="float: left; width: 50%">
            <tr>
                <td> 
                    <h3>Titulo:</h3>
                </td>
                <td>
                    <input type="text" name="titulo" maxlength="100" 
                    placeholder="Digite o titulo" required>
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Nome do Orientador:</h3>
                </td>
                <td>
                    <input type="text" name="nomeOrientador" maxlength="100"
                    placeholder="Digite o nome do orientador" required>
                </td>   
            </tr>
            <tr>
                <td>
                    <h3>Descrição:</h3>
                </td>
                <td>
                    <textarea name="descricao" style="width: 85%; height: 100px; resize: none; font-family: Arial, Helvetica, sans-serif; padding: 10px" 
                    placeholder="Digite uma descricao breve do projeto(resumo)" required></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Data avalicao:</h3>
                </td>
                <td>
                    <input type="date" name="dataAvaliacao" required>
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Curso:</h3>
                </td>
                <td>
                    <input list="cursos" name="curso" required>
                    <datalist id="cursos">
                        {% for curso in cursos %}
                            <option value="[[ curso['descricaoCurso'] ]]">
                        {% endfor %}
                    </datalist>
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Arquivo:</h3>
                </td>
                <td>
                    <input type="file" name="file" 
                    onchange="document.getElementById('nome').innerHTML = this.value" id="file" required>
                </td>
            </tr>
        </table>
        <div style="float: left; width: 49%">
            <div style="margin-bottom: 10px">
                <fieldset>
                    <legend>
                        <h2>Autores</h2>
                    </legend>
                    <fieldset>
                        <legend>
                            <h3>Autor 1</h3>
                        </legend>
                        <label for="autor">Nome:</label>
                        <input type="text" name="autor" placeholder="Digite o nome do autor"/>
                        <br>
                        <label for="ra">Ra:</label>
                        <input type="text" name="ra_autor" placeholder="Digite o RA" maxlength="13"/>
                    </fieldset>
                    <div id="imendaHTMLautor">
                    </div>
                            
                    <input type="button" id="btnAdicionaAutor" value="adicionar mais um autor" style="padding: 2px"
                    onclick="adicionaAutor()">      
                </fieldset>
            </div>
            <div>
                <fieldset>
                    <legend>
                        <h2>Palavras-chave</h2>
                    </legend>
                    <fieldset>
                        <legend>
                            <h3>Palavra-chave 1</h3>
                        </legend>
                        <label for="palavra_chave">Palavra:</label>
                        <input type="text" name="palavra_chave" placeholder="Digite a palavra-chave"/>
                    </fieldset>
                    <div id="imendaHTMLpalavra"></div>
                                
                    <input type="button" id="btnAdicionaPalavraChave" value="adicionar mais uma palavra-chave" style="padding: 2px"
                    onclick="adicionaPalavaChave()"> 
                </fieldset>  
            </div>
            <input type=submit value=Upload>
        </div>
    </fieldset>
</form>
<p>[[ filename ]]</p>
<p id="nome"></p>

<script type="text/javascript">
var idContadorAutor = 0
var idContadorPalavra = 0

function adicionaPalavaChave(){
    if(idContadorPalavra > 9)
        return

    idContadorPalavra++
    let idPalavra = `palavra_chave_${ idContadorPalavra }`
    let idDiv = `palavra_chave_div_${ idContadorPalavra }`

    let tituloPalavra = document.createElement('label')
    tituloPalavra.innerHTML = `Palavra-chave extra ${ idContadorPalavra }:`

    let div = document.createElement('div')
    div.id = idDiv
    
    let legend = document.createElement('legend')
    legend.innerHTML = `<h3>Palavra-chave ${ idContadorPalavra + 1 }</h3>`

    let fieldset = document.createElement('fieldset')
    fieldset.append(legend)
    
    let inputPalavra = document.createElement('input')
    inputPalavra.type = 'text'
    inputPalavra.placeholder = 'Digite a palavra-chave'
    inputPalavra.id = idPalavra
    inputPalavra.required = true
    inputPalavra.name = idPalavra

    let btnRemove = document.createElement('input')
    btnRemove.id = 'btnRemovePala'
    btnRemove.type = 'button'
    btnRemove.value = 'Remover'
    btnRemove.onclick = function(){
        document.getElementById(`palavra_chave_div_${ idContadorPalavra }`).remove()
        idContadorPalavra--
    }

    let container = document.getElementById('imendaHTMLpalavra')
    fieldset.append(tituloPalavra, inputPalavra)
    fieldset.innerHTML += '<br>'
    fieldset.append(btnRemove)
    div.append(fieldset)
    container.append(div)
}

function adicionaAutor(){
    if(idContadorAutor > 3)
        return

    idContadorAutor++
    let idNome = `autor_${ idContadorAutor }`
    let idRa = `ra_autor_${ idContadorAutor }`
    let idDiv = `autor_div_${ idContadorAutor }`

    let tituloNome = document.createElement('label')
    tituloNome.innerHTML = `Autor extra ${ idContadorAutor }:`

    let tituloRa = document.createElement('label')
    tituloRa.innerHTML = `Ra extra ${ idContadorAutor }:`

    let div = document.createElement('div')
    div.id = idDiv
    
    let fieldset = document.createElement('fieldset')
    let legend = document.createElement('legend')
    legend.innerHTML = `<h3>Autor ${ idContadorAutor + 1 }</h3>`
    fieldset.append(legend)
    
    let inputNome = document.createElement('input')
    inputNome.type = 'text'
    inputNome.placeholder = 'Digite o nome do autor'
    inputNome.id = idNome
    inputNome.required = true
    inputNome.name = idNome

    let inputRa = document.createElement('input')
    inputRa.type = 'text'
    inputRa.placeholder = 'Digite o RA'
    inputRa.id = idRa
    inputRa.required = true
    inputRa.name = idRa
    inputRa.maxLength = 13

    let btnRemove = document.createElement('input')
    btnRemove.id = 'btnRemoveAut'
    btnRemove.type = 'button'
    btnRemove.value = 'Remover'
    btnRemove.onclick = function(){
        document.getElementById(`autor_div_${ idContadorAutor }`).remove()
        idContadorAutor--
    }

    let container = document.getElementById('imendaHTMLautor')
    fieldset.append(tituloNome, inputNome)
    fieldset.innerHTML += '<br>'
    fieldset.append(tituloRa, inputRa)
    fieldset.innerHTML += '<br>'
    fieldset.append(btnRemove)
    div.append(fieldset)
    container.append(div)
}

function remove(id){
    document.getElementById(id).remove()
}
</script>
{% endblock %}
