{% extends "base.html" %}

{% block content %}
<h1>Cadastro de usuarios</h1>
<form method=post enctype=multipart/form-data>
    <table>
        <tr>
            <td><label>Nome de usuario: </label></td>
            <td><input type=text name=username required><br></td>
        </tr>
        <tr>
            <td><label>Tipo de usuairo: </label></td>
            <td>
                <select name="tipoUsuario">
                    {% for tipo in tipos %}
                        <option value="[[ tipo ]]">[[ tipo ]]</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr>
            <td><label>Gerenciador: </label></td>
            <td>
                <select name="gerenciador">
                    {% for gerenciador in gerenciadores %}
                        <option value="[[ gerenciador['nomeGerenciador'] ]]">[[ gerenciador['nomeGerenciador'] ]]</option>
                    {% endfor %}
                </select>
                <!--
                <input type="text" name="gerenciador" list="gerenciador" required>
                <datalist id="gerenciador">
                    {% for gerenciador in gerenciadores %}
                        <option value="[[ gerenciador['nomeGerenciador'] ]]">
                    {% endfor %}
                </datalist>-->
            </td>
        </tr>
        <tr>
            <td><label>Senha: </label></td>
            <td><input type="password" name="password" required><br></td>
        </tr>
        <tr>
            <td><label>Repetir senha: </label></td>
            <td><input type="password" name="r_password" required><br></td>
        </tr>
        <tr>
            <td><input type=submit value=Cadastrar></td>
        </tr>
    </table>
</form>
{% endblock %}
